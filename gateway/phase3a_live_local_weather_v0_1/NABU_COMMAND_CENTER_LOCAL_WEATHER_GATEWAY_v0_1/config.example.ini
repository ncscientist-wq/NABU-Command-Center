[gateway]
# store, http, or both
mode = store

# HTTP binds to loopback by default.
host = 127.0.0.1
port = 8765

# Set this to the verified NABU Internet Adapter Store directory.
# The actual user-specific path is intentionally NOT guessed.
store_path = .\store

interval_seconds = 10
auto_refresh = false
initial_sequence = 1
fixed_value = 42
fixed_text = GATEWAY_RECORD_01
failure_mode = valid

# Leave blank for current UTC. A fixed value makes deterministic fixtures.
fixed_utc =

log_path = .\logs\gateway.log
